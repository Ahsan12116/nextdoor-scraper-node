name: Unblockable Full Sheet Sync Engine
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync_and_scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Production Core Packages
        run: npm install puppeteer googleapis

      - name: Run Background Scraping Automation
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: "1aIdDfNsFdUqFDDZHpGcnppiVNVr4faOhPqrUo-rnurQ"
        run: |
          node -e '
          const puppeteer = require("puppeteer");
          const { google } = require("googleapis");

          async function main() {
            const auth = new google.auth.GoogleAuth({
              credentials: JSON.parse(process.env.GOOGLE_CREDS),
              scopes: ["https://www.googleapis.com/auth/spreadsheets"]
            });
            const sheets = google.sheets({ version: "v4", auth });
            const spreadsheetId = process.env.SPREADSHEET_ID;

            const response = await sheets.spreadsheets.values.get({
              spreadsheetId,
              range: "sheet1!A2:Z"
            });
            
            const rows = response.data.values;
            if (!rows || rows.length === 0) {
              console.log("No targets found inside sheet rows.");
              return;
            }

            const headers = [
              "Name", "Street Address", "City", "State", "Zip Code", "Country", 
              "Phone", "Email", "Website", "Latitude", "Longitude", 
              "Categories", "Hours", "Status"
            ];
            await sheets.spreadsheets.values.update({
              spreadsheetId,
              range: "sheet1!M1:Z1",
              valueInputOption: "RAW",
              requestBody: { values: [headers] }
            });

            // HIGH STEALTH FLAGS: Bypasses headless detection layers completely
            const launchArgs = [
              "--no-sandbox",
              "--disable-setuid-sandbox",
              "--disable-blink-features=AutomationControlled",
              "--disable-infobars",
              "--window-size=1920,1080",
              "--start-maximized",
              // Route requests through a public free residential rotation node proxy to mask Datacenter IP
              "--proxy-server=http://unblock.scrapeninja.co:8888" 
            ];

            let browser = await puppeteer.launch({ 
              headless: true, 
              args: launchArgs,
              ignoreDefaultArgs: ["--enable-automation"]
            });
            
            let page = await browser.newPage();
            await page.setViewport({ width: 1920, height: 1080 });

            // Evaluate scripts on the page to hide Puppeteer fingerprints
            await page.evaluateOnNewDocument(() => {
              Object.defineProperty(navigator, "webdriver", { get: () => undefined });
              window.navigator.chrome = { runtime: {} };
              Object.defineProperty(navigator, "languages", { get: () => ["en-US", "en"] });
              Object.defineProperty(navigator, "plugins", { get: () => [1, 2, 3, 4, 5] });
            });

            let processedCount = 0;

            for (let i = 0; i < rows.length; i++) {
              let url = rows[i][0];
              let currentStatus = rows[i][25] ? rows[i][25].toString() : "";
              let rowNum = i + 2; 

              if (!url || !url.startsWith("http") || currentStatus.includes("✅")) continue;

              if (processedCount > 0 && processedCount % 8 === 0) {
                console.log("🔄 Re-initializing hard stealth browser session window...");
                await browser.close();
                await new Promise(r => setTimeout(r, 6000));
                browser = await puppeteer.launch({ headless: true, args: launchArgs, ignoreDefaultArgs: ["--enable-automation"] });
                page = await browser.newPage();
                await page.setViewport({ width: 1920, height: 1080 });
                await page.evaluateOnNewDocument(() => {
                  Object.defineProperty(navigator, "webdriver", { get: () => undefined });
                  window.navigator.chrome = { runtime: {} };
                  Object.defineProperty(navigator, "languages", { get: () => ["en-US", "en"] });
                });
              }

              console.log(`Processing Row ${rowNum} (#${processedCount + 1}): ${url}`);
              processedCount++;

              try {
                // Mimic genuine desktop user agents
                await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36");
                
                // Set extra headers to act as a normal browser navigation request
                await page.setExtraHTTPHeaders({
                  "accept-language": "en-US,en;q=0.9",
                  "accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
                  "sec-ch-ua": "\"Chromium\";v=\"122\", \"Not(A:Brand\";v=\"24\", \"Google Chrome\";v=\"122\"",
                  "sec-ch-ua-mobile": "?0",
                  "sec-ch-ua-platform": "\"Windows\""
                });

                await page.goto(url.trim(), { waitUntil: "domcontentloaded", timeout: 40000 });
                
                // Wait specifically for the core target block container to load completely
                await page.waitForSelector(".name-selector", { timeout: 8000 }).catch(() => {});

                const result = await page.evaluate(() => {
                  const getTxt = (sel) => {
                    const el = document.querySelector(sel);
                    return el ? el.innerText.trim() : "Not found";
                  };

                  const cats = Array.from(document.querySelectorAll(".category-selector")).map(el => el.innerText.trim());
                  const categoriesStr = cats.length > 0 ? cats.join(", ") : "Not found";

                  const days = Array.from(document.querySelectorAll(".day-of-week-selector")).map(el => el.innerText.trim());
                  const hours = Array.from(document.querySelectorAll(".day-of-week-hours-selector")).map(el => el.innerText.trim());
                  let calendarStr = "Not found";
                  if (days.length > 0 && days.length === hours.length) {
                    calendarStr = days.map((d, idx) => `${d}: ${hours[idx] === "" ? "Closed" : hours[idx]}`).join(" | ");
                  }

                  return {
                    name: getTxt(".name-selector"),
                    street: getTxt(".street-address-selector"),
                    city: getTxt(".city-selector"),
                    state: getTxt(".state-selector"),
                    zip: getTxt(".zip-code-selector"),
                    country: getTxt(".country-selector") || "US",
                    phone: getTxt(".phone-number-selector"),
                    email: getTxt(".email-selector"),
                    website: getTxt(".website-url-selector"),
                    lat: getTxt(".latitude-selector"),
                    lng: getTxt(".longitude-selector"),
                    categories: categoriesStr,
                    hours: calendarStr
                  };
                });

                await sheets.spreadsheets.values.update({
                  spreadsheetId,
                  range: `sheet1!M${rowNum}:Z${rowNum}`,
                  valueInputOption: "RAW",
                  requestBody: {
                    values: [[
                      result.name, result.street, result.city, result.state, result.zip, result.country,
                      result.phone, result.email, result.website, result.lat, result.lng,
                      result.categories, result.hours, "✅ SUCCESS"
                    ]]
                  }
                });

              } catch (err) {
                console.error(`Error on row ${rowNum}:`, err.message);
                await sheets.spreadsheets.values.update({
                  spreadsheetId,
                  range: `sheet1!Z${rowNum}`,
                  valueInputOption: "RAW",
                  requestBody: { values: [["❌ Error: " + err.message]] }
                });
              }
              
              // Human Randomized Jitter Sleep Delay
              const jitter = Math.floor(Math.random() * (8000 - 4000 + 1)) + 4000;
              await new Promise(r => setTimeout(r, jitter));
            }
            await browser.close();
          }
          main().catch(console.error);
          '
