name: Unblockable Full Sheet Sync Engine
on:
  workflow_dispatch:
  repository_dispatch:
    types: [loop_next_batch]

jobs:
  sync_and_scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Production Core Packages
        run: npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth googleapis axios

      - name: Run Background Scraping Automation
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: "1aIdDfNsFdUqFDDZHpGcnppiVNVr4faOhPqrUo-rnurQ"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node -e '
          const puppeteer = require("puppeteer-extra");
          const StealthPlugin = require("puppeteer-extra-plugin-stealth");
          const { google } = require("googleapis");
          const axios = require("axios");
          puppeteer.use(StealthPlugin());

          async function main() {
            const auth = new google.auth.GoogleAuth({
              credentials: JSON.parse(process.env.GOOGLE_CREDS),
              scopes: ["https://www.googleapis.com/auth/spreadsheets"]
            });
            const sheets = google.sheets({ version: "v4", auth });
            const spreadsheetId = process.env.SPREADSHEET_ID;

            const response = await sheets.spreadsheets.values.get({
              spreadsheetId,
              range: "sheet1!A2:Z"
            });
            
            const rows = response.data.values;
            if (!rows || rows.length === 0) {
              console.log("No targets found inside sheet rows.");
              return;
            }

            const headers = [
              "Name", "Street Address", "City", "State", "Zip Code", "Country", 
              "Phone", "Email", "Website", "Latitude", "Longitude", 
              "Categories", "Hours", "Status"
            ];
            await sheets.spreadsheets.values.update({
              spreadsheetId,
              range: "sheet1!M1:Z1",
              valueInputOption: "RAW",
              requestBody: { values: [headers] }
            });

            // Filter out rows that are already completed
            const tasks = [];
            for (let i = 0; i < rows.length; i++) {
              let url = rows[i][0];
              let currentStatus = rows[i][25] ? rows[i][25].toString() : "";
              let rowNum = i + 2;
              if (url && url.startsWith("http") && !currentStatus.includes("✅")) {
                tasks.push({ url: url.trim(), rowNum: rowNum });
              }
            }

            if (tasks.length === 0) {
              console.log("🏁 Every single row in your Google Sheet has been successfully scraped!");
              return;
            }

            // Define multi-threading batch limit (3 operations simultaneously)
            const CONCURRENCY_LIMIT = 3;
            const BATCH_TARGET_LIMIT = 40; // Max rows per VM before self-loop rotation
            
            let browser = await puppeteer.launch({ headless: true, args: ["--no-sandbox", "--disable-setuid-sandbox"] });
            let processedInThisRun = 0;

            // Worker loop function running parallel channels
            async function scrapeWorker(task) {
              let page = await browser.newPage();
              await page.setViewport({ width: 1280, height: 800 });
              console.log(`🚀 [Row ${task.rowNum}] Launching worker thread for: ${task.url}`);

              try {
                await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36");
                await page.goto(task.url, { waitUntil: "networkidle2", timeout: 35000 });
                await page.waitForSelector(".name-selector", { timeout: 6000 }).catch(() => {});

                const result = await page.evaluate(() => {
                  const getTxt = (sel) => {
                    const el = document.querySelector(sel);
                    return el ? el.innerText.trim() : "Not found";
                  };
                  const cats = Array.from(document.querySelectorAll(".category-selector")).map(el => el.innerText.trim());
                  const days = Array.from(document.querySelectorAll(".day-of-week-selector")).map(el => el.innerText.trim());
                  const hours = Array.from(document.querySelectorAll(".day-of-week-hours-selector")).map(el => el.innerText.trim());
                  
                  let calendarStr = "Not found";
                  if (days.length > 0 && days.length === hours.length) {
                    calendarStr = days.map((d, idx) => `${d}: ${hours[idx] === "" ? "Closed" : hours[idx]}`).join(" | ");
                  }
                  return {
                    name: getTxt(".name-selector"), street: getTxt(".street-address-selector"),
                    city: getTxt(".city-selector"), state: getTxt(".state-selector"),
                    zip: getTxt(".zip-code-selector"), country: getTxt(".country-selector") || "US",
                    phone: getTxt(".phone-number-selector"), email: getTxt(".email-selector"),
                    website: getTxt(".website-url-selector"), lat: getTxt(".latitude-selector"), lng: getTxt(".longitude-selector"),
                    categories: cats.length > 0 ? cats.join(", ") : "Not found", hours: calendarStr
                  };
                });

                await sheets.spreadsheets.values.update({
                  spreadsheetId,
                  range: `sheet1!M${task.rowNum}:Z${task.rowNum}`,
                  valueInputOption: "RAW",
                  requestBody: {
                    values: [[
                      result.name, result.street, result.city, result.state, result.zip, result.country,
                      result.phone, result.email, result.website, result.lat, result.lng,
                      result.categories, result.hours, "✅ SUCCESS"
                    ]]
                  }
                });
                console.log(`⚡ [Row ${task.rowNum}] Successfully written to Google Sheet.`);

              } catch (err) {
                console.error(`❌ [Row ${task.rowNum}] Thread processing error:`, err.message);
                await sheets.spreadsheets.values.update({
                  spreadsheetId,
                  range: `sheet1!Z${task.rowNum}`,
                  valueInputOption: "RAW",
                  requestBody: { values: [["❌ Error: " + err.message]] }
                });
              } finally {
                await page.close();
              }
            }

            // Process tasks in concurrent groups of 3
            for (let i = 0; i < tasks.length; i += CONCURRENCY_LIMIT) {
              if (processedInThisRun >= BATCH_TARGET_LIMIT) {
                console.log("🛑 Target batch threshold reached! Shutting down current VM session safely...");
                await browser.close();

                console.log("🔄 Calling GitHub Dispatch API to deploy a fresh runner machine with a clean IP...");
                try {
                  await axios.post(
                    `https://api.github.com/repos/${process.env.REPO_OWNER}/${process.env.REPO_NAME}/dispatches`,
                    { event_type: "loop_next_batch" },
                    {
                      headers: {
                        "Authorization": `token ${process.env.GITHUB_TOKEN}`,
                        "Accept": "application/vnd.github.v3+json"
                      }
                    }
                  );
                  console.log("🚀 Fresh VM request transmitted successfully.");
                } catch (dispatchErr) {
                  console.error("Failed to trigger next automated runner loop:", dispatchErr.message);
                }
                process.exit(0);
              }

              const batch = tasks.slice(i, i + CONCURRENCY_LIMIT);
              processedInThisRun += batch.length;
              
              // Fire off all 3 scraping workers asynchronously at the exact same time
              await Promise.all(batch.map(task => scrapeWorker(task)));
              
              // Small pacing delay between concurrent batches
              const dynamicDelay = Math.floor(Math.random() * (5000 - 3000 + 1)) + 3000;
              await new Promise(r => setTimeout(r, dynamicDelay));
            }

            await browser.close();
            console.log("🏁 All available rows have been processed!");
          }
          main().catch(console.error);
          '
