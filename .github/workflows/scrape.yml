name: Unblockable Full Sheet Sync Engine
on:
  workflow_dispatch: # Allows manual starting
  repository_dispatch:
    types: [loop_next_batch] # Allows the runner to call itself natively

jobs:
  sync_and_scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Google API & Network Libraries
        run: npm install googleapis axios

      - name: Execute Authenticated JSON Engine
        env:
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDENTIALS }}
          NEXTDOOR_COOKIE: ${{ secrets.NEXTDOOR_COOKIE }}
          SPREADSHEET_ID: "1aIdDfNsFdUqFDDZHpGcnppiVNVr4faOhPqrUo-rnurQ"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in token to trigger the next VM
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          node -e '
          const { google } = require("googleapis");
          const axios = require("axios");

          async function main() {
            const auth = new google.auth.GoogleAuth({
              credentials: JSON.parse(process.env.GOOGLE_CREDS),
              scopes: ["https://www.googleapis.com/auth/spreadsheets"]
            });
            const sheets = google.sheets({ version: "v4", auth });
            const spreadsheetId = process.env.SPREADSHEET_ID;

            const response = await sheets.spreadsheets.values.get({
              spreadsheetId,
              range: "sheet1!A2:Z"
            });
            
            const rows = response.data.values;
            if (!rows || rows.length === 0) {
              console.log("No targets found inside sheet rows.");
              return;
            }

            // Standardize columns layout
            const headers = [
              "Name", "Street Address", "City", "State", "Zip Code", "Country", 
              "Phone", "Email", "Website", "Latitude", "Longitude", 
              "Categories", "Hours", "Status"
            ];
            await sheets.spreadsheets.values.update({
              spreadsheetId,
              range: "sheet1!M1:Z1",
              valueInputOption: "RAW",
              requestBody: { values: [headers] }
            });

            let processedInThisRun = 0;
            let totalRemainingToProcess = 0;

            // First, calculate if there are more rows left to do overall
            for (let i = 0; i < rows.length; i++) {
              let currentStatus = rows[i][25] ? rows[i][25].toString() : "";
              if (rows[i][0] && rows[i][0].startsWith("http") && !currentStatus.includes("✅")) {
                totalRemainingToProcess++;
              }
            }

            console.log(`📊 Total un-scraped rows left in sheet: ${totalRemainingToProcess}`);

            for (let i = 0; i < rows.length; i++) {
              let url = rows[i][0];
              let currentStatus = rows[i][25] ? rows[i][25].toString() : "";
              let rowNum = i + 2; 

              if (!url || !url.startsWith("http") || currentStatus.includes("✅")) continue;

              // HARD LIMIT CLOSURE: Stop precisely at 45 rows to remain under the IP radar
              if (processedInThisRun >= 45) {
                console.log("🛑 Target threshold hit! Shutting down current VM session safely...");
                
                // Fire a repository dispatch to immediately spin up a completely fresh VM runner instance
                console.log("🔄 Calling GitHub Dispatch API to deploy a fresh runner machine with a clean IP...");
                try {
                  await axios.post(
                    `https://api.github.com/repos/${process.env.REPO_OWNER}/${process.env.REPO_NAME}/dispatches`,
                    { event_type: "loop_next_batch" },
                    {
                      headers: {
                        "Authorization": `token ${process.env.GITHUB_TOKEN}`,
                        "Accept": "application/vnd.github.v3+json"
                      }
                    }
                  );
                  console.log("🚀 Fresh VM request transmitted successfully.");
                } catch (dispatchErr) {
                  console.error("Failed to trigger next automated runner loop:", dispatchErr.message);
                }
                
                process.exit(0); // Exit cleanly
              }

              console.log(`Processing Row ${rowNum} (#${processedInThisRun + 1}): ${url}`);
              processedInThisRun++;

              try {
                const res = await axios.get(url.trim(), {
                  timeout: 15000,
                  headers: {
                    "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                    "Accept-Language": "en-US,en;q=0.9",
                    "Cookie": process.env.NEXTDOOR_COOKIE,
                    "Cache-Control": "no-cache"
                  }
                });

                const html = res.data;
                let jsonStateMatch = html.match(/<script id="__NEXT_DATA__" type="application\/json">([\s\S]*?)<\/script>/);
                
                if (!jsonStateMatch) {
                  throw new Error("Empty block layout served by firewall.");
                }

                const parsedData = JSON.parse(jsonStateMatch[1]);
                const bizProps = parsedData.props?.pageProps?.initialState?.businessPage || {};
                const coreDetails = bizProps.details || {};
                
                let nameText = coreDetails.name || "Not found";
                let streetText = coreDetails.address?.street || "Not found";
                let cityText = coreDetails.address?.city || "Not found";
                let stateText = coreDetails.address?.state || "Not found";
                let zipText = coreDetails.address?.zip || "Not found";
                let phoneText = coreDetails.phone || "Not found";
                let emailText = coreDetails.email || "Not found";
                let websiteText = coreDetails.websiteUrl || coreDetails.website || "Not found";
                let latText = coreDetails.latitude ? coreDetails.latitude.toString() : "Not found";
                let lngText = coreDetails.longitude ? coreDetails.longitude.toString() : "Not found";
                
                let categoriesStr = bizProps.categories ? bizProps.categories.map(c => c.name).join(", ") : "Not found";
                let hoursStr = "Not found";
                if (bizProps.operatingHours) {
                  hoursStr = bizProps.operatingHours.map(h => `${h.day}: ${h.slots ? h.slots.map(s => `${s.start}-${s.end}`).join(",") : "Closed"}`).join(" | ");
                }

                await sheets.spreadsheets.values.update({
                  spreadsheetId,
                  range: `sheet1!M${rowNum}:Z${rowNum}`,
                  valueInputOption: "RAW",
                  requestBody: {
                    values: [[
                      nameText, streetText, cityText, stateText, zipText, "US",
                      phoneText, emailText, websiteText, latText, lngText,
                      categoriesStr, hoursStr, "✅ SUCCESS"
                    ]]
                  }
                });

              } catch (err) {
                console.error(`Error on row ${rowNum}:`, err.message);
                await sheets.spreadsheets.values.update({
                  spreadsheetId,
                  range: `sheet1!Z${rowNum}`,
                  valueInputOption: "RAW",
                  requestBody: { values: [["❌ Error: Cookie Expired or Throttled"]] }
                });
              }

              const variableInterval = Math.floor(Math.random() * (5000 - 3000 + 1)) + 3000;
              await new Promise(r => setTimeout(r, variableInterval));
            }

            console.log("🏁 Hurray! Every single URL in your Google Sheet has been successfully scraped!");
          }
          main().catch(console.error);
          '
